name: Temporary Structured Console Smoke

on:
  push:
    branches:
      - structured-console-rendering

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: structured-console-rendering
      - name: Correct developer option implementation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("typer/main.py")
          text = path.read_text()
          old = '''    return _click.Option(\n        ["--developer"],\n        is_flag=True,\n        is_eager=True,\n        expose_value=False,\n        callback=_developer_mode_callback,\n        help="Enable developer mode with structured console rendering.",\n    )'''
          new = '''    return TyperOption(\n        param_decls=["developer", "--developer"],\n        is_flag=True,\n        is_eager=True,\n        expose_value=False,\n        callback=_developer_mode_callback,\n        help="Enable developer mode with structured console rendering.",\n    )'''
          if old in text:
              path.write_text(text.replace(old, new, 1))
          elif new not in text:
              raise RuntimeError("Developer option patch anchor not found")
          PY
      - name: Commit correction
        shell: bash
        run: |
          if git diff --quiet -- typer/main.py; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add typer/main.py
          git commit -m "Use TyperOption for developer mode flag"
          git push origin HEAD:structured-console-rendering
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e .
      - name: Run structured console smoke checks
        run: |
          python - <<'PY'
          import typer
          from typer.testing import CliRunner

          runner = CliRunner()

          app = typer.Typer(developer_mode=True, add_completion=False)

          @app.command()
          def main():
              typer.echo({"answer": 42})

          normal = runner.invoke(app, [])
          assert normal.exit_code == 0, normal.output
          assert normal.output == "{'answer': 42}\n", normal.output

          developer = runner.invoke(app, ["--developer"])
          assert developer.exit_code == 0, developer.output
          assert "Value" in developer.output
          assert "type: builtins.dict" in developer.output
          assert "value: {'answer': 42}" in developer.output
          assert "repr: {'answer': 42}" in developer.output

          root = typer.Typer(developer_mode=True, add_completion=False)
          child = typer.Typer(add_completion=False)

          @child.command()
          def show():
              typer.echo((1, 2, 3))

          root.add_typer(child, name="child")
          nested = runner.invoke(root, ["--developer", "child", "show"])
          assert nested.exit_code == 0, nested.output
          assert "type: builtins.tuple" in nested.output
          assert "value: (1, 2, 3)" in nested.output
          PY
